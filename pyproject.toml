[project]
name = "ai-team"
version = "0.2.0"
description = "A field study of multi-agent failure modes: shared harness over CrewAI, LangGraph, and Claude Agent SDK"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rick Zakharov", email = "rick.zakharov@gmail.com" }]
requires-python = ">=3.11,<3.14"
# Direct dependencies are what `src/` and `evals/` import. Security floors for
# packages that only arrive transitively live in [tool.uv] constraint-dependencies,
# so this list reads as the real dependency surface.
dependencies = [
    # Orchestration frameworks (one per backend)
    "crewai>=1.0.0,<2.0.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langgraph-supervisor>=0.0.31,<0.1.0",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.14",
    "claude-agent-sdk>=0.1.0",
    # Held below 1.80 for the CrewAI 1.6 / Pydantic 2.12 recursion issue. Stay off
    # 1.82.7 and 1.82.8: both were malicious uploads (PyPI, 2026-03-24), see
    # https://docs.litellm.ai/blog/security-update-march-2026
    "litellm==1.74.9",
    # Core runtime
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "structlog>=24.1.0,<25.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "httpx>=0.27.0,<0.28.0",
    "requests>=2.33.0,<3.0.0",
    "gitpython>=3.1.60",
    # Web control plane
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
ai-team = "ai_team.main:main"
ai-team-web = "ai_team.ui.web.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "ruff>=0.16.0,<0.17.0",
    "mypy>=1.9.0,<2.0.0",
    "pre-commit>=3.7.0,<4.0.0",
    "flask>=3.1.3,<4.0.0",
    "types-pyyaml>=6.0.12.20250915",
    "pip-audit>=2.10.0,<3.0.0",
    "pytest-playwright>=0.8.0,<0.9.0",
    "pytest-randomly>=5.0.0",
    "anthropic>=0.111.0",  # evals/fixtures builds recorded Claude fixtures
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Frontend node_modules/dist are local/CI artifacts, not the Python package.
[tool.hatch.build.targets.sdist]
exclude = [
  "/src/ai_team/ui/web/frontend/node_modules",
  "/src/ai_team/ui/web/frontend/dist",
  "/workspace",
  "/output",
  "/.coverage-data",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_team"]
exclude = [
  "/src/ai_team/ui/web/frontend/node_modules",
  "/src/ai_team/ui/web/frontend/dist",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "*.md",  # ruff >=0.15 formats code fences in Markdown; specs quote code verbatim
  "tests/fixtures/mini_workspace",
  "evals/fixtures/traces",
  "evals/judges/cache",
  "evals/arms/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",  # line length is the formatter's job
  "UP042",  # (str, Enum) -> StrEnum changes str()/format() output of persisted values
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Resolve src-layout duplicate-module errors (same file as ``ai_team.*`` vs ``src.ai_team.*``).
explicit_package_bases = true
mypy_path = "src:."

# Type-debt floor: counted by tests/unit/repo/test_type_budget.py (LOC, not module
# count). Exit conditions are inline. Do not add a module without stating why the
# floor moved the wrong way in the same commit message.
[[tool.mypy.overrides]]
module = [
  "evals.fixtures",  # exit: type the fixture loaders after corpus schema freeze
  "evals.fixtures.*",
  "evals.metrics",  # exit: replace Any score dicts with Pydantic
  "evals.arms.vendor",  # pinned third-party copy; never typed
  "evals.arms.vendor.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "ai_team.backends.langgraph_backend.*",  # exit: after Track B or a dedicated typing pass
  "ai_team.backends.claude_agent_sdk_backend.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "ai_team.backends.crewai_backend.agents.*",  # exit: after crewai_backend move (Track B) or a typing pass
  "ai_team.backends.crewai_backend.crews.*",
  "ai_team.backends.crewai_backend.flows.main_flow",
  "ai_team.memory.memory_config",  # exit: annotate Chroma/SQLite helpers
  "ai_team.tools.git_tools",  # exit: GitPython types
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short -p no:randomly"
norecursedirs = [
  ".*",
  "build",
  "dist",
  "CVS",
  "_darcs",
  "{arch}",
  "*.egg",
  "venv",
  ".venv",
  "mini_workspace",
  "fixtures/traces",
  "fixtures/parser_samples",
]
markers = [
    "integration: integration tests (may require API keys or external services).",
    "e2e: end-to-end tests (real AITeamFlow run, no mocks).",
    "full_flow: full AITeamFlow tests driven by manual runner (no kickoff).",
    "real_llm: integration tests that use real OpenRouter when AI_TEAM_USE_REAL_LLM=1.",
    "slow: slow tests (e.g. real LLM or long runs); exclude with -m 'not slow'.",
    "timeout: per-test timeout (pytest-timeout).",
    "performance: performance benchmark tests; record timings and write benchmark_results.json.",
    "web_e2e: Web dashboard E2E (demo/mock; no LLM cost).",
    "browser_e2e: Playwright browser E2E (requires built frontend).",
    "eval_unit: unit tests for the eval harness (deterministic, no network).",
    "eval_tier_a: Tier A offline replay eval suite ($0 spend).",
    "bus_draft: ToolBus draft-then-commit enabled (default tests use live I/O).",
]

[tool.uv]
# Floors for transitive packages (CVE fixes). A constraint narrows a version when
# the package is already in the graph; it never adds the package on its own.
# https://docs.astral.sh/uv/concepts/resolution/#dependency-constraints
constraint-dependencies = [
    "pip>=26.2",  # via pip-audit; PYSEC-2026-3721 / CVE-2026-13346
    "aiohttp>=3.14.3",  # CVE-2026-34513 family
    "cryptography>=50.0.0",
    "idna>=3.15",
    "langgraph-sdk>=0.4.4",  # CVE-2026-104873
    "langsmith>=0.8.18",  # via langchain-core; zero direct imports
    "lxml>=6.1.0",
    "multidict>=6.9.1",  # CVE-2026-104874
    "oauthlib>=4.0.0",  # PYSEC-2026-4114
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "pyjwt>=2.15.0",  # PYSEC-2026-4140 family; 2.15 covers the 2.14 and 2.15 fixes
    "python-multipart>=0.0.31",
    "setuptools>=83.0.0",
    "urllib3>=2.8.0",  # PYSEC-2026-4175 family
    "virtualenv>=21.7.13",  # PYSEC-2026-4011 family
    "werkzeug>=3.1.9",  # CVE-2026-102598
    "huggingface-hub>=0.20,<1",  # 1.x breaks the chromadb/tokenizers stack
]

[tool.coverage.run]
source = ["src/ai_team", "evals"]
branch = true
data_file = ".coverage-data/.coverage"
omit = [
  "evals/arms/vendor/*",
]

[tool.coverage.report]
# Fail the run if total coverage drops below this floor. It is a regression gate,
# not a target — ratchet upward after each green week. Applied wherever pytest runs
# with --cov (CI unit-test step).
#
# History:
#   55  initial floor (src/ai_team only; actual was ~63% combined line+branch)
#   58  2026-09-12 — `evals` added to the measured source (11.6k lines that were
#       previously unmeasured; it scores ~66%, so the combined total barely moved).
#       Still allows the ~6pt branch-coverage variance seen between macOS dev and
#       ubuntu-latest CI. Re-ratchet once a full local run confirms the combined
#       figure — this floor was set from a partial (evals-only) measurement.
#   60  2026-09-12 — harness-alignment (task 11.6). Full `tests/unit` on macOS
#       measured 66% combined line+branch (`src/ai_team` + `evals`, vendor
#       omitted). Floor is measured minus the ~6pt macOS/ubuntu branch variance.
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
