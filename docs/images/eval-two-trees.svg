<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#c3c1b6" stroke-width="2"/>
    </pattern>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,1 L10,5.5 L0,10 z" fill="#b4462f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,1 L10,5.5 L0,10 z" fill="#1d9e75"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#faf9f5"/>
  <rect x="0" y="0" width="1200" height="6" fill="#1d9e75"/>

  <text x="70" y="66" font-size="17" font-weight="600" fill="#0f6e56" letter-spacing="2">A FAILURE MODE WORTH CHECKING FOR</text>
  <text x="70" y="120" font-size="44" font-weight="700" fill="#1a1a2e">Two trees, one reader</text>
  <text x="70" y="156" font-size="20" fill="#5f5e5a">When the writer and the reader disagree about where traces live, nothing fails loudly. The corpus just comes back empty.</text>

  <!-- LEFT: workspace -->
  <rect x="70" y="196" width="490" height="288" rx="12" fill="#ffffff" stroke="#e0b4a8" stroke-width="1.5"/>
  <rect x="70" y="196" width="6" height="288" rx="3" fill="#b4462f"/>
  <text x="102" y="234" font-size="21" font-weight="700" fill="#1a1a2e">workspace/&lt;run_id&gt;/</text>
  <text x="102" y="259" font-size="15" fill="#8a7068">what the AGENTS wrote</text>

  <text x="102" y="299" font-size="16" font-family="monospace" fill="#3c3a36">src/</text>
  <text x="300" y="299" font-size="16" font-family="monospace" fill="#6e6c66">generated code</text>
  <text x="102" y="327" font-size="16" font-family="monospace" fill="#3c3a36">tests/</text>
  <text x="300" y="327" font-size="16" font-family="monospace" fill="#6e6c66">generated tests</text>
  <line x1="102" y1="346" x2="528" y2="346" stroke="#eae7dd" stroke-width="1"/>
  <text x="102" y="376" font-size="16" font-family="monospace" fill="#b4462f">logs/*.jsonl</text>
  <text x="300" y="376" font-size="16" font-family="monospace" font-weight="700" fill="#b4462f">0 files</text>

  <rect x="102" y="398" width="426" height="62" rx="8" fill="#fcf1ee" stroke="#e8cec6"/>
  <text x="122" y="424" font-size="15" fill="#8a4636">440 directories · 221 of them empty</text>
  <text x="122" y="447" font-size="15" fill="#8a4636">219 with artifacts and no telemetry at all</text>

  <!-- RIGHT: output/runs -->
  <rect x="640" y="196" width="490" height="288" rx="12" fill="#ffffff" stroke="#a8d8c6" stroke-width="1.5"/>
  <rect x="640" y="196" width="6" height="288" rx="3" fill="#1d9e75"/>
  <text x="672" y="234" font-size="21" font-weight="700" fill="#1a1a2e">output/runs/&lt;run_id&gt;/</text>
  <text x="672" y="259" font-size="15" fill="#4d8a76">what the HARNESS wrote</text>

  <text x="672" y="299" font-size="16" font-family="monospace" fill="#3c3a36">run.json</text>
  <text x="960" y="299" font-size="16" font-family="monospace" font-weight="700" fill="#137a59" text-anchor="end">210</text>
  <text x="985" y="299" font-size="13" fill="#6e6c66">backend · status</text>
  <text x="672" y="327" font-size="16" font-family="monospace" fill="#3c3a36">state.json</text>
  <text x="960" y="327" font-size="16" font-family="monospace" font-weight="700" fill="#137a59" text-anchor="end">141</text>
  <text x="985" y="327" font-size="13" fill="#6e6c66">cost · tokens</text>
  <text x="672" y="355" font-size="16" font-family="monospace" fill="#3c3a36">logs/costs.jsonl</text>
  <text x="960" y="355" font-size="16" font-family="monospace" font-weight="700" fill="#137a59" text-anchor="end">60</text>
  <text x="672" y="383" font-size="16" font-family="monospace" fill="#3c3a36">receipt.json</text>
  <text x="960" y="383" font-size="16" font-family="monospace" font-weight="700" fill="#137a59" text-anchor="end">8</text>

  <rect x="672" y="402" width="426" height="58" rx="8" fill="#eefaf5" stroke="#c4e6d9"/>
  <text x="692" y="427" font-size="15" fill="#186b51">3 backends · 211 dated run dirs</text>
  <text x="692" y="449" font-size="15" font-weight="700" fill="#186b51">6 July → 13 September · a 69-day span</text>

  <!-- arrows -->
  <path d="M500,556 L330,500" stroke="#b4462f" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M700,556 L870,500" stroke="#1d9e75" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>
  <text x="296" y="548" font-size="14" font-weight="700" fill="#b4462f" letter-spacing="1" text-anchor="end">READS THIS ONE</text>
  <text x="904" y="548" font-size="14" font-weight="700" fill="#1d9e75" letter-spacing="1">SHOULD READ THIS ONE</text>

  <!-- code box -->
  <rect x="300" y="556" width="600" height="62" rx="10" fill="#1a1a2e"/>
  <text x="600" y="583" font-size="15" font-family="monospace" fill="#9fe3c8" text-anchor="middle">evals/cli.py:547</text>
  <text x="600" y="606" font-size="15" font-family="monospace" fill="#f4f2ec" text-anchor="middle">backfill.add_argument("--workspace-root", default="./workspace")</text>

  <text x="600" y="653" font-size="17" fill="#5f5e5a" text-anchor="middle">The corpus indexed as <tspan font-weight="700" fill="#1a1a2e">one backend over 1.97 seconds</tspan> could have been three backends over 69 days. For $0.00.</text>
</svg>
