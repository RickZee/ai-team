<text x="70" y="64" font-size="17" font-weight="600" fill="#0f6e56" letter-spacing="2">WEEK 5 · WHAT A CHECK CAN SAY</text>
<text x="70" y="120" font-size="42" font-weight="700" fill="#1a1a2e">Pass, fail — or quietly abstain</text>
<text x="70" y="156" font-size="20" fill="#5f5e5a">A check that says "not applicable" every time looks calm and decides nothing.</text>
<rect x="70" y="190" width="330" height="130" rx="12" fill="#e8f5ef" stroke="#1d9e75" stroke-width="1.5"/><rect x="70" y="190" width="6" height="130" rx="3" fill="#1d9e75"/>
