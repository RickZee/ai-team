<text x="100" y="270" font-size="16" font-weight="400" fill="#5f5e5a" text-anchor="start" >the evidence is there</text>
<text x="100" y="294" font-size="16" font-weight="400" fill="#5f5e5a" text-anchor="start" >and it's fine</text>
<rect x="430" y="190" width="330" height="130" rx="12" fill="#fbeeea" stroke="#b8432f" stroke-width="1.5"/><rect x="430" y="190" width="6" height="130" rx="3" fill="#b8432f"/>
<text x="460" y="236" font-size="24" font-weight="700" fill="#b8432f" text-anchor="start" font-family="Menlo, Consolas, monospace">fail</text>
<text x="460" y="270" font-size="16" font-weight="400" fill="#5f5e5a" text-anchor="start" >the evidence is there</text>
<text x="460" y="294" font-size="16" font-weight="400" fill="#5f5e5a" text-anchor="start" >and it's wrong</text>
