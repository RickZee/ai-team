<text x="820" y="236" font-size="24" font-weight="700" fill="#8a877e" text-anchor="start" font-family="Menlo, Consolas, monospace">not applicable</text>
<text x="820" y="270" font-size="16" font-weight="400" fill="#5f5e5a" text-anchor="start" >nothing to look at —</text>
<text x="820" y="294" font-size="16" font-weight="400" fill="#5f5e5a" text-anchor="start" >silent in most reports</text>
