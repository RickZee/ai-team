<text x="70" y="120" font-size="42" font-weight="700" fill="#1a1a2e">The run finished. The record says it never ended.</text>
<text x="70" y="156" font-size="20" fill="#5f5e5a">Five seconds, no model calls. Compare what happened with what was written down.</text>
