<text x="510.83" y="366" font-size="16" font-weight="700" fill="#1a1a2e" text-anchor="start" >0–24%</text>
<line x1="300" y1="410" x2="1110" y2="410" stroke="#ddd9cc" stroke-width="2"/>
<line x1="300" y1="404" x2="300" y2="416" stroke="#96938a"/>
