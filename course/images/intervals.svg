<text x="705.0" y="440" font-size="14" font-weight="400" fill="#96938a" text-anchor="middle" >50%</text>
<line x1="908" y1="404" x2="908" y2="416" stroke="#96938a"/>
<text x="907.5" y="440" font-size="14" font-weight="400" fill="#96938a" text-anchor="middle" >75%</text>
