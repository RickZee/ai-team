<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Helvetica, Arial, sans-serif"><rect width="1200" height="600" fill="#faf9f5"/>
<rect width="1200" height="6" fill="#1d9e75"/>
<text x="70" y="64" font-size="17" font-weight="600" fill="#0f6e56" letter-spacing="2">WEEK 6 · EVERY NUMBER NEEDS ITS n</text>
<text x="70" y="120" font-size="42" font-weight="700" fill="#1a1a2e">5 out of 5 vs 1 out of 5 is not a ranking</text>
<text x="70" y="156" font-size="20" fill="#5f5e5a">95% Wilson intervals. When they overlap, you haven't shown a difference yet.</text>
