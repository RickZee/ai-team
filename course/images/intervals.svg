<text x="1110" y="440" font-size="14" font-weight="400" fill="#96938a" text-anchor="middle" >100%</text>
<text x="70" y="500" font-size="18" font-weight="700" fill="#1a1a2e" text-anchor="start" >Say it with its kind and its n:</text>
<text x="70" y="532" font-size="18" font-weight="400" fill="#5f5e5a" text-anchor="start" font-family="Menlo, Consolas, monospace">"CORPUS, n=12: 0 failures (95% CI 0–24%)."  Not "0% failure rate."</text>
<text x="70" y="566" font-size="14" font-weight="400" fill="#96938a" text-anchor="start" >1/5 and 5/5 intervals are from this repo's n=5 backend batches · README → Results</text>
