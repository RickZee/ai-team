# Terraform checks with no cloud credentials.
name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

jobs:
  terraform:
    name: fmt, validate, tflint, checkov
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws, azure]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform init and validate
        working-directory: infra/terraform/${{ matrix.stack }}/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.54.0

      - name: tflint
        working-directory: infra/terraform/${{ matrix.stack }}/envs/dev
        env:
          # Authenticated releases API avoids shared-runner 403 rate limits on --init.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config ../../../.tflint.hcl
          tflint --config ../../../.tflint.hcl

      - name: checkov
        run: |
          pip install checkov==3.2.470
          checkov -d infra/terraform/${{ matrix.stack }} --quiet --compact
