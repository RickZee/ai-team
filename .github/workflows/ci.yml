# CI workflow: lint, test, integration-test, security
#
# Status badge (use in README):
#   [![CI](https://github.com/OWNER/REPO/actions/workflows/ci.yml/badge.svg)](https://github.com/OWNER/REPO/actions/workflows/ci.yml)
# Replace OWNER/REPO with your GitHub org/repo.
#
# Branch protection recommendation:
#   - Require status checks: lint, test, security (and optionally integration-test for main)
#   - Require branches to be up to date before merging
#   - Require pull request reviews before merging (optional)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Mypy evals
        run: uv run mypy evals/

      - name: Hatchling package build
        run: uv build

      - name: Repository invariant guards
        run: uv run pytest tests/unit/repo -q --tb=line

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        env:
          COVERAGE_FILE: .coverage-data/.coverage.${{ matrix.python-version }}
          COVERAGE_CORE: sysmon
        run: |
          mkdir -p test-results .coverage-data
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            uv run pytest tests/unit -v --tb=short \
              --cov=src/ai_team --cov=evals --cov-report=xml --cov-report=term \
              --junitxml=test-results/unit.xml
          else
            uv run pytest tests/unit -v --tb=short \
              --junitxml=test-results/unit.xml
          fi

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: test-results-unit-${{ matrix.python-version }}
          path: test-results/

  web-e2e:
    name: Web UI E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ai_team/ui/web/frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Install frontend dependencies
        working-directory: src/ai_team/ui/web/frontend
        run: npm ci

      - name: Frontend lint
        working-directory: src/ai_team/ui/web/frontend
        run: npm run lint

      - name: Frontend unit tests
        working-directory: src/ai_team/ui/web/frontend
        run: npm test

      - name: Build frontend
        working-directory: src/ai_team/ui/web/frontend
        run: npm run build

      - name: Run web E2E (demo/mock — no LLM)
        run: uv run pytest tests/e2e/web -m web_e2e -v --tb=short --timeout=120

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests
        run: |
          mkdir -p test-results
          uv run pytest tests/integration -v --tb=short --junitxml=test-results/integration.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: test-results-integration
          path: test-results/

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install bandit (pip-audit is a project dev dependency)
        run: uv run pip install bandit

      - name: Upgrade pip (audit tooling CVEs)
        run: uv run python -m pip install --upgrade "pip>=26.2"

      - name: Bandit security scan
        run: uv run bandit -r src/ -f json -o bandit-report.json || true
        continue-on-error: true

      # litellm pinned at 1.74.9 (CrewAI/Pydantic); PYSEC-2026-347{6-9}, PYSEC-2026-3861,
      # CVE-2026-1277{1,2,3,5} ignored in pip_audit.sh (fixes need 1.83+).
      # PYSEC-2026-3819: crewai-tools SSRF; fix 1.15.1+ — stay on 1.6.1 until CrewAI bump.
      # uv/pyjwt/langchain-community advisories are transitive via crewai until upstream resolves.
      # starlette 1.0.1+ requires fastapi to lift starlette<1.0.0 (see fastapi pin).
      # chromadb CVE-2026-45830/31/33: Python server IDOR; no PyPI fix (see pip_audit.sh).
      - name: Pip-audit dependency vulnerabilities
        run: ./scripts/pip_audit.sh | tee pip-audit-report.txt

      - name: Upload pip-audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.txt

      - name: Upload bandit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ---------------------------------------------------------------------------
  # Tier A offline eval — $0 spend, no secrets. Gate starts in --warn-only mode
  # (task 9.4): DO NOT remove --warn-only until one week of green nightlies.
  # ---------------------------------------------------------------------------
  eval-tier-a:
    name: Eval Tier A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Redaction lint on fixtures
        run: uv run python -m evals.cli fixtures redact --root evals/fixtures --lint

      - name: Run Tier A (warn-only soak — do not flip gate yet)
        # Task 9.4: leave --warn-only until a week of green nightlies, then remove it.
        run: |
          OUT="evals/results/ci-tier-a"
          mkdir -p "$OUT"
          uv run python -m evals.cli run --tier A --warn-only --out "$OUT" \
            --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload Tier A report artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: eval-tier-a-report
          path: |
            evals/results/ci-tier-a/report.json
            evals/results/ci-tier-a/report.md
            evals/results/ci-tier-a/report.html
            evals/results/ci-tier-a/summary.txt
            evals/results/ci-tier-a/gate.md

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build image
        run: docker build -f docker/Dockerfile -t ai-team:ci .

      - name: Assert non-root, no gcc, size, health
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint "" ai-team:ci id -u)"
          test "$uid" != "0"
          if docker run --rm --entrypoint "" ai-team:ci sh -c 'command -v gcc'; then
            echo "gcc must not be on PATH in the runtime image" >&2
            exit 1
          fi
          size="$(docker image inspect ai-team:ci --format '{{.Size}}')"
          echo "image_bytes=$size"
          mb="$(awk -F' *= *' '/^docker_image_mb/{print $2; exit}' tests/unit/repo/ratchets.toml)"
          echo "ratchet_mib=$mb"
          test -n "$mb"
          test "$size" -lt $((mb * 1024 * 1024))
          cid="$(docker run -d --name aiteam-ci ai-team:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$cid" curl -fsS http://127.0.0.1:8421/api/health >/dev/null; then
              echo "health ok"
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid" || true
          echo "healthcheck failed" >&2
          exit 1

      - name: Compose build (no GPU)
        run: docker compose -f docker/docker-compose.yml build
