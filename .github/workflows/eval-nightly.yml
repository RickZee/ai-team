# Nightly Tier B eval (R12.6 / R12.7)
#
# Runs budgeted live evals when secrets are present. When secrets are absent,
# exits neutrally (success) so the workflow is not a red X — forks and public
# mirrors without keys stay green.
#
# On gate failure, opens or updates a tracking issue with the summary.
#
# Schedule disabled 2026-09-13: Actions has neither ANTHROPIC_API_KEY nor
# OPENROUTER_API_KEY, so the cron only produced empty green skips. Restore the
# cron below when a key is configured:
#   on:
#     schedule:
#       - cron: "15 6 * * *"   # 06:15 UTC daily
#     workflow_dispatch:

name: Eval Nightly

on:
  workflow_dispatch:

concurrency:
  group: eval-nightly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AI_TEAM_EVAL_BUDGET_USD: "2.00"

jobs:
  eval-tier-b:
    name: Eval Tier B
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check secrets
        id: secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ANTHROPIC_API_KEY / OPENROUTER_API_KEY — skipping Tier B neutrally (R12.7)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.secrets.outputs.present != 'true'
        run: |
          {
            echo "## Eval Nightly — skipped"
            echo ""
            echo "Required secrets absent; neutral skip (R12.7)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        if: steps.secrets.outputs.present == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.secrets.outputs.present == 'true'
        run: uv sync --frozen

      - name: Warm judge cache (stub-ok) + run Tier B
        if: steps.secrets.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run python -m evals.cli cache warm --tier B || true
          # Live Tier B execution via run_evals (budget enforced).
          set +e
          uv run python -m evals.run_evals --tier B --k 1 --yes \
            --scenario smoke-test 2>&1 | tee /tmp/eval-nightly.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "$CODE" > /tmp/eval-nightly.exit
        id: run

      - name: Job summary
        if: steps.secrets.outputs.present == 'true'
        run: |
          {
            echo "## Eval Nightly Tier B"
            echo ""
            echo "Budget ceiling: \$${AI_TEAM_EVAL_BUDGET_USD}"
            echo ""
            if [ -f /tmp/eval-nightly.log ]; then
              echo '```'
              tail -n 40 /tmp/eval-nightly.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update failure issue
        if: steps.secrets.outputs.present == 'true' && failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const title = 'Eval nightly Tier B gate failure';
            const body = [
              'Automated nightly Tier B eval failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Budget: `$2.00` (`AI_TEAM_EVAL_BUDGET_USD`).',
              '',
              'Please inspect artifacts / logs and either fix the regression or accept a new baseline with a reason.',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'eval-nightly',
              per_page: 10,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['eval-nightly'],
              });
            }

      - name: Commit warmed judge cache (bot branch)
        if: steps.secrets.outputs.present == 'true' && success()
        run: |
          if [ -n "$(git status --porcelain evals/judges/cache 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            BRANCH="bot/eval-cache-warm-$(date -u +%Y%m%d)"
            git checkout -B "$BRANCH"
            git add evals/judges/cache
            git commit -m "chore(evals): warm judge cache from nightly Tier B"
            git push -u origin "$BRANCH" || true
          else
            echo "No judge cache changes to commit."
          fi
