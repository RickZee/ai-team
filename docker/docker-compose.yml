services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8421:8421"
    environment:
      # Bind guard still refuses 0.0.0.0 when this is empty. Required at `up`,
      # optional at `build` so a clean checkout can compose-build without a GPU.
      AI_TEAM_WEB_TOKEN: ${AI_TEAM_WEB_TOKEN:-}
    command: ["--host", "0.0.0.0"]
    volumes:
      - ../output:/app/output
      - ../workspace:/app/workspace
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks:
      - aiteam

  # Optional local LLM. Default path is OpenRouter/Anthropic.
  #   docker compose -f docker/docker-compose.yml --profile local-llm up
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - aiteam

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ../output/otel:/otel
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - aspire-dashboard
    networks:
      - aiteam

  aspire-dashboard:
    profiles: ["observability"]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.4.2
    ports:
      - "18888:18888"
    environment:
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    networks:
      - aiteam

  strands:
    profiles: ["strands"]
    build:
      context: ..
      dockerfile: docker/strands.Dockerfile
      platforms: [linux/arm64]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - aiteam

  agent-framework:
    profiles: ["agent-framework"]
    build:
      context: ..
      dockerfile: docker/agent-framework.Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - aiteam

networks:
  aiteam:
    driver: bridge

volumes:
  ollama_models:
